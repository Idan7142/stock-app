<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מניות">
<title>המניות של עידן</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:Heebo;src:url(heebo.ttf) format("truetype");font-weight:100 900;font-display:swap}
:root{--bg:#070b18;--bg2:#0d1426;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.07);--line:rgba(255,255,255,.08);
--tx:#e8edf7;--mut:#8b96ad;--up:#22c55e;--dn:#ef4444;--gold:#facc15;--acc:#60a5fa;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;overscroll-behavior-y:contain}
.num{direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-block}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
header{position:fixed;top:0;inset-inline:0;z-index:30;padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;gap:12px;
background:linear-gradient(180deg,rgba(7,11,24,.96),rgba(7,11,24,.75));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.burger{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.burger span{display:block;width:20px;height:2px;background:var(--tx);border-radius:2px;position:relative}
.burger span:before,.burger span:after{content:"";position:absolute;inset-inline:0;height:2px;background:var(--tx);border-radius:2px}
.burger span:before{top:-6px}.burger span:after{top:6px}
.htitle{flex:1;font-weight:700;font-size:18px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.refresh{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:18px;cursor:pointer}
.refresh.spin{animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
main{padding:calc(var(--safe-t) + 78px) 16px calc(var(--safe-b) + 30px);max-width:640px;margin:0 auto}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(82vw,330px);background:linear-gradient(180deg,#0f1830,#0a1022);z-index:50;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
padding:calc(var(--safe-t) + 18px) 14px 20px;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
body.menu .scrim{opacity:1;pointer-events:auto}body.menu .drawer{transform:none}
.dhead{display:flex;align-items:center;gap:12px;padding:4px 6px 18px;border-bottom:1px solid var(--line);margin-bottom:10px}
.dhead img{width:44px;height:44px;border-radius:12px}.dhead b{font-size:17px}.dhead div small{display:block;color:var(--mut);font-size:12px}
.nav a{display:flex;align-items:center;gap:14px;padding:14px 12px;margin:3px 0;border-radius:14px;color:var(--tx);text-decoration:none;font-size:16.5px;font-weight:500}
.nav a .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--card2);flex:none}
.nav a.on{background:linear-gradient(90deg,rgba(96,165,250,.0),rgba(96,165,250,.16));box-shadow:inset -3px 0 0 var(--acc)}
.nav a small{display:block;color:var(--mut);font-size:12px;font-weight:400}
.dfoot{margin-top:auto;color:var(--mut);font-size:12px;padding:10px 8px;line-height:1.5}
/* home */
.hero{position:relative;border-radius:28px;overflow:hidden;padding:30px 22px 26px;margin-top:6px;
background:radial-gradient(120% 90% at 100% 0%,rgba(96,165,250,.35),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(34,197,94,.22),transparent 60%),linear-gradient(160deg,#111b36,#0a1124);border:1px solid var(--line)}
.hero:after{content:"";position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='200'><path d='M0 160 L50 140 L90 150 L140 110 L190 120 L240 80 L290 95 L340 50 L400 30' fill='none' stroke='%23facc15' stroke-opacity='.12' stroke-width='3'/></svg>") bottom/100% 60% no-repeat;pointer-events:none}
.hero .logo{width:64px;height:64px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.hero h1{margin:18px 0 6px;font-size:30px;font-weight:800;line-height:1.15}
.hero p{margin:0;color:#b8c3da;font-size:15.5px;line-height:1.5}
.hero .when{margin-top:14px;font-size:13px;color:var(--mut)}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px;position:relative;z-index:1}
.pill{background:rgba(7,11,24,.55);border:1px solid var(--line);border-radius:16px;padding:12px}
.pill .n{font-size:12.5px;color:var(--mut)}.pill .v{font-size:18px;font-weight:700;margin-top:2px}.pill .p{font-size:14px;font-weight:600}
.cta{margin-top:18px;display:flex;gap:10px;position:relative;z-index:1}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:var(--tx);color:#0a1022}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tile{display:block;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;min-height:118px;position:relative;overflow:hidden}
.tile .ic{font-size:24px}.tile b{display:block;margin-top:10px;font-size:15.5px}.tile small{color:var(--mut);font-size:12.5px}
.tile .kpi{position:absolute;top:14px;left:14px;font-size:13px;font-weight:700}
.tile.wide{grid-column:1/-1;min-height:auto;display:flex;align-items:center;gap:14px}.tile.wide b{margin:0}
/* generic */
h2{font-size:24px;margin:8px 0 4px;font-weight:800}.sub{color:var(--mut);font-size:13.5px;margin:0 0 16px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}
.stat .v{font-size:19px;font-weight:800}.stat .l{font-size:11.5px;color:var(--mut);margin-top:2px}
.rec .top{display:flex;align-items:flex-start;gap:10px}
.tk{font-weight:800;font-size:18px;letter-spacing:.3px}.nm{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.big{margin-inline-start:auto;text-align:left;font-size:22px;font-weight:800}
.big small{display:block;font-size:11.5px;color:var(--mut);font-weight:400;text-align:left}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv{background:rgba(255,255,255,.03);border-radius:12px;padding:8px}.kv .l{font-size:11px;color:var(--mut)}.kv .v{font-size:14.5px;font-weight:600}
.range{margin-top:12px}.range .bar{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--dn),#f59e0b 40%,var(--up));position:relative;opacity:.85}
.range .dot{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #0a1022;transform:translate(50%,-50%);box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.range .lb{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:6px}
.badge{display:inline-block;font-size:11.5px;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--mut);margin-inline-end:4px;margin-top:6px}
.badge.g{background:rgba(34,197,94,.14);color:#86efac}.badge.r{background:rgba(239,68,68,.14);color:#fca5a5}.badge.y{background:rgba(250,204,21,.13);color:#fde68a}
.chips{display:flex;gap:8px;margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--tx);color:#0a1022;font-weight:700}
.day{font-size:13px;color:var(--mut);margin:18px 4px 8px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .mid{flex:1;min-width:0}.row .px{font-size:12.5px;color:var(--mut)}
.row .p{font-weight:800;font-size:16px;text-align:left;min-width:70px}
.flag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--mut);margin-inline-start:6px}
.idx{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.idx .nm2{font-weight:700;font-size:16px}.idx .en{font-size:11.5px;color:var(--mut)}
.idx .pr{font-size:21px;font-weight:800;text-align:left}.idx .ch{text-align:left;font-weight:700;font-size:14.5px}
.idx svg{grid-column:1/-1;width:100%;height:54px;margin-top:6px}
.idx .per{grid-column:1/-1;display:flex;gap:8px;margin-top:6px}
.idx .per span{flex:1;background:rgba(255,255,255,.03);border-radius:10px;padding:6px 8px;font-size:12px;color:var(--mut)}
.idx .per b{display:block;font-size:14px}
.scan{white-space:pre-wrap;line-height:1.65;font-size:14px;color:#cdd6e8}
.scan li{margin-bottom:6px}.scan ul{padding-inline-start:18px;margin:6px 0}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}details summary:after{content:"▾";margin-inline-start:auto;color:var(--mut)}
details[open] summary:after{content:"▴"}
.sec{display:flex;align-items:center;gap:10px;margin:20px 0 10px}.sec h3{margin:0;font-size:18px}.sec .tag{font-size:12px;color:var(--mut)}
.wbar{height:6px;border-radius:6px;background:rgba(255,255,255,.06);margin-top:6px;position:relative;overflow:hidden}
.wbar i{position:absolute;top:0;bottom:0;border-radius:6px}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:24px;line-height:1.7}
.empty{color:var(--mut);text-align:center;padding:24px 10px;font-size:14px}
.fade{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nb{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:#ef4444;color:#fff;font-size:11.5px;font-weight:800;line-height:1}
.burger{position:relative}.burger .nb{font-style:normal;position:absolute;top:-6px;left:-6px;box-shadow:0 0 0 2px var(--bg)}
.nav a .nb{margin-inline-start:auto}
.ghero{display:flex;align-items:center;gap:14px;margin:4px 0 14px}.ghero img{width:52px;height:52px;border-radius:15px}
.ghero h1{margin:0;font-size:24px;font-weight:800}.ghero p{margin:2px 0 0;color:var(--mut);font-size:13.5px}
.feedh{display:flex;align-items:center;gap:10px;margin:6px 0 10px}.feedh h2{margin:0;font-size:21px}.feedh .tag{font-size:12.5px;color:var(--mut)}
.feedh .live{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.rc{background:linear-gradient(160deg,rgba(96,165,250,.10),rgba(255,255,255,.035) 45%);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;position:relative}
.rc.isnew{border-color:rgba(250,204,21,.55);box-shadow:0 0 0 1px rgba(250,204,21,.25),0 10px 30px rgba(250,204,21,.06)}
.rc .hd{display:flex;align-items:flex-start;gap:10px}.rc .tk{font-size:21px}
.rc .chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.whenb{display:inline-block;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;cursor:pointer;border:0;font-family:inherit;line-height:1.3}
.whenb.eve{background:rgba(129,140,248,.18);color:#c7d2fe}
.whenb.morn{background:rgba(250,204,21,.16);color:#fde68a}
.whenn{display:none;margin-top:8px;font-size:12.5px;color:#b8c3da;line-height:1.5}
.whenn.on,.whenn.show{display:block}
.row .whenb{margin-top:4px;font-size:11px}
.mtag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.mtag.upd{background:rgba(96,165,250,.16);color:#93c5fd}
.mtag.can{background:rgba(239,68,68,.16);color:#fca5a5}
.mtag.ok{background:rgba(34,197,94,.16);color:#86efac}
.rc.gone,.row.gone{opacity:.55;filter:grayscale(.35)}
.act{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px}
.act.buy{background:rgba(34,197,94,.16);color:#86efac}.act.sell{background:rgba(239,68,68,.16);color:#fca5a5}.act.conditional{background:rgba(250,204,21,.15);color:#fde68a}
.newb{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--gold);color:#1a1400;animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 rgba(250,204,21,0)}to{box-shadow:0 0 12px rgba(250,204,21,.55)}}
.cond{margin-top:10px;font-size:13.5px;background:rgba(250,204,21,.08);border:1px dashed rgba(250,204,21,.35);color:#fde68a;border-radius:12px;padding:8px 10px}
.plan{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.plan .kv{text-align:center;padding:8px 4px}.plan .kv .v{font-size:14px}.plan .kv .s{font-size:11px;margin-top:1px}
.why{margin-top:12px;font-size:14px;line-height:1.6;color:#d5ddee;border-inline-start:3px solid var(--acc);padding:2px 10px 2px 0;background:rgba(96,165,250,.05);border-radius:0 0 0 0}
.why small{display:block;color:var(--mut);font-size:11.5px;margin-top:4px}
.rf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--mut)}
.rf .now{margin-inline-start:auto;font-size:14px;color:var(--tx);font-weight:600}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--mut)}
.st.open{background:rgba(96,165,250,.15);color:#93c5fd}.st.target{background:rgba(34,197,94,.15);color:#86efac}.st.stop,.st.stopped,.st.cancelled{background:rgba(239,68,68,.15);color:#fca5a5}
.st.conditional{background:rgba(250,204,21,.13);color:#fde68a}.st.expired{background:rgba(255,255,255,.06);color:var(--mut)}
.mkt{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;margin:16px 0 4px}
.mkt .pills{margin:8px 0 0}.mkt .pill{background:rgba(255,255,255,.03)}
.fab{position:fixed;left:16px;bottom:calc(var(--safe-b) + 18px);z-index:25;display:flex;align-items:center;gap:8px;padding:13px 18px;border-radius:999px;
background:linear-gradient(135deg,#60a5fa,#a78bfa);color:#0a1022;font-weight:800;font-size:15px;text-decoration:none;box-shadow:0 10px 30px rgba(96,165,250,.35)}
.ask{display:flex;align-items:center;gap:14px;padding:18px;border-radius:20px;text-decoration:none;color:#0a1022;font-weight:800;font-size:18px;margin:6px 0 10px}
.ask.s{background:linear-gradient(135deg,#facc15,#fb923c)}.ask.l{background:linear-gradient(135deg,#4ade80,#22d3ee)}
.ask .ic{font-size:28px}.ask small{display:block;font-weight:500;font-size:12.5px;opacity:.8}
.q{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.5}
.q:last-child{border-bottom:0}.q span{flex:1}
.cp{flex:none;border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.cp.ok{background:rgba(34,197,94,.18);color:#86efac}
.toast{position:fixed;bottom:calc(var(--safe-b) + 24px);left:50%;transform:translateX(-50%);background:#111b36;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <button class="burger" id="burger" aria-label="תפריט"><span></span></button>
  <div class="htitle" id="htitle">המניות של עידן<small id="hsub">טוען נתונים…</small></div>
  <button class="refresh" id="refresh" aria-label="רענון">⟳</button>
</header>
<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="תפריט">
  <div class="dhead"><img src="icons/icon-192.png" alt=""><div><b>המניות של עידן</b><small>מעקב המלצות ובורסות</small></div></div>
  <div class="nav" id="nav"></div>
  <div class="dfoot" id="dfoot"></div>
</nav>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
const PAGES = [
  {id:'home',  ic:'🏠', t:'דף הבית', s:'מסך פתיחה'},
  {id:'active',ic:'🎯', t:'המלצות פעילות', s:'כל ההמלצות הפתוחות כרגע'},
  {id:'portfolio',ic:'💼', t:'תיק מניות', s:'תיק לטווח ארוך · יעד 10% בשנה'},
  {id:'consult',ic:'💬', t:'התייעצות', s:'שאל את הבוטים מה לקנות עכשיו'},
  {id:'long',  ic:'🌱', t:'מניות לטווח הארוך', s:'המלצות הבוט לטווח ארוך'},
  {id:'short', ic:'⚡', t:'מניות לטווח הקצר', s:'המלצות יומיות, ת״א וארה״ב'},
  {id:'us',    ic:'🇺🇸', t:'בורסת ארה״ב', s:'מדדים, עליות וירידות'},
  {id:'tase',  ic:'🇮🇱', t:'בורסת תל אביב', s:'מדדים, עליות וירידות'},
  {id:'weekly',ic:'📊', t:'סיכום מניות שבועי', s:'קצר וארוך בנפרד'},
];
let D = null, shortFilter = 'all', weekIdx = 0;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, d=2) => v==null ? '—' : Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const cur = c => c==='ILS' ? '₪' : '$';
const money = (v, c) => v==null ? '<span class="num mut">—</span>' : `<span class="num">${c==='ILS'?'':'$'}${fmt(v, v>=1000?1:2)}${c==='ILS'?' ₪':''}</span>`;
const pc = (v, big) => v==null ? '<span class="num mut">—</span>' : `<span class="num ${v>0?'up':v<0?'dn':''}">${v>0?'▲ +':v<0?'▼ ':''}${fmt(v)}%</span>`;
const cls = v => v==null?'':v>0?'up':v<0?'dn':'';
const dmy = s => { if(!s) return '—'; const [y,m,d] = s.slice(0,10).split('-'); return `${+d}.${+m}`; };
const tstr = iso => { if(!iso) return '—'; const d = new Date(iso); return d.toLocaleString('he-IL',{timeZone:'Asia/Jerusalem',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}); };

function nav(){
  const cur = (location.hash||'#home').slice(1);
  const n = newCount();
  $('#nav').innerHTML = PAGES.map(p=>`<a href="#${p.id}" class="${p.id===cur?'on':''}"><span class="ic">${p.ic}</span><span>${p.t}<small>${p.s}</small></span>${(p.id==='active'||p.id==='home')&&n?`<span class="nb">${n}</span>`:''}</a>`).join('');

  return {date:`${p.year}-${p.month}-${p.day}`, hour:(+p.hour)%24, wd:p.weekday}; }

  if (n.hour >= 22) return {day: nextTD(n.date), mode:'tomorrow'};
  if (isWeekend(n.date)) return {day: nextTD(n.date), mode:'next'};
  return {day: n.date, mode:'today'}; }

  let seen = null; try { seen = JSON.parse(localStorage.getItem('seenRecs')||'null'); } catch(e){}

    const latest = new Set(feedShortIds().length ? feedShortIds() : D.short.rows.filter(r=>r.date===D.feed.latest_short_day).map(r=>r.id));
    seen = all.filter(id => !latest.has(id));

function spark(arr, up){
  const a = (arr||[]).filter(x=>x!=null); if (a.length<2) return '';
  const mn = Math.min(...a), mx = Math.max(...a), W=300, H=54, n=a.length;
  const pts = a.map((v,i)=>[W - i*(W/(n-1)), H-4-((v-mn)/((mx-mn)||1))*(H-8)]);  // RTL: newest on the left
  const c = up ? '#22c55e' : '#ef4444', d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const id = 'g'+Math.random().toString(36).slice(2,7);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
   <path d="${d} L${pts[n-1][0]} ${H} L${pts[0][0]} ${H} Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${c}" stroke-width="2"/></svg>`;
}
function mdlite(s){
  const lines = esc(s).split('\n'); let out = '', inl = false;
  for (let l of lines){
    l = l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if (/^## /.test(l)) { out += `<b style="font-size:15px">${l.slice(3)}</b>\n`; continue; }
    if (/^\s*[-•] /.test(l)) { if(!inl){out+='<ul>';inl=true;} out += `<li>${l.replace(/^\s*[-•] /,'')}</li>`; continue; }
    if (inl){out+='</ul>';inl=false;} out += l + '\n';
  }
  if (inl) out += '</ul>';
  return out;
}

  const sWorst = S.rows.find(r=>r.ticker===S.worst && r.pct!=null && r.pct===Math.min(...S.rows.filter(x=>x.pct!=null).map(x=>x.pct)));
  if (sBest) h += `<div class="card" style="display:flex;gap:10px"><div style="flex:1">🏆 הכי טובה<br><b>${esc(sBest.ticker)}</b> ${pc(sBest.pct)}</div><div style="flex:1">📉 הכי חלשה<br><b>${esc(sWorst.ticker)}</b> ${pc(sWorst.pct)}</div><div style="flex:1">🎯 ${S.targets} נגעו ביעד<br>🛑 ${S.stops} נגעו בסטופ</div></div>`;
  h += `<div class="card" style="padding:4px 14px">${S.rows.length? S.rows.slice().sort((a,b)=>(b.pct??-1e9)-(a.pct??-1e9)).map(r=>{
    const gone = r.status==='cancelled' || r.status==='stop' || r.status==='stopped';
    const tag = r.status==='cancelled' ? '<span class="mtag can">בוטל</span>' : r.status==='stop'||r.status==='stopped' ? '<span class="mtag can">✕ נעצרה בסטופ</span>' : r.status==='target' ? '<span class="mtag ok">✓ הגיעה ליעד</span>' : '';
    return `<div class="row${gone?' gone':''}" style="display:block"><div style="display:flex;gap:8px;align-items:center"><span class="tk" style="font-size:15px">${esc(r.ticker)}</span><span class="nm">${esc(r.name)} · ${dmy(r.date)}</span><span class="flag">${r.bot.includes('ת״א')?'ת״א':'ארה״ב'}</span>${tag}<span style="margin-inline-start:auto;font-weight:800">${r.conditional&&r.ref==null?'<span class="mut" style="font-size:12px">מותנה</span>':pc(r.pct)}</span></div>
    <div class="px">${money(r.ref,r.cur)} ← ${money(r.close,r.cur)} (${dmy(r.close_date)})</div>${wbar(r.pct, mxS)}</div>`;
  }).join('') : '<div class="empty">אין המלצות לטווח קצר בשבוע הזה.</div>'}</div>`;
  // long
  const L = w.long, ls = L.stats; const mxL = Math.max(1, ...L.rows.map(r=>Math.abs(r.week_pct||0)));
  h += `<div class="sec"><h3>🌱 טווח ארוך</h3><span class="tag">${L.rows.length} מניות במעקב</span></div>`;
  h += stats(null, [[pc(ls.avg),'שינוי ממוצע השבוע'],[`<span class="up">${ls.up}</span> / <span class="dn">${ls.down}</span>`,'עלו / ירדו'],[pc(L.since_rec.avg),'ממוצע מאז ההמלצה']]);
  if (L.best) h += `<div class="card" style="display:flex;gap:10px"><div style="flex:1">🏆 הכי טובה השבוע<br><b>${esc(L.best)}</b> ${pc((L.rows.find(r=>r.ticker===L.best)||{}).week_pct)}</div><div style="flex:1">📉 הכי חלשה השבוע<br><b>${esc(L.worst)}</b> ${pc((L.rows.find(r=>r.ticker===L.worst)||{}).week_pct)}</div></div>`;
  h += `<div class="card" style="padding:4px 14px">${L.rows.length? L.rows.slice().sort((a,b)=>(b.week_pct??-1e9)-(a.week_pct??-1e9)).map(r=>{
    const gone = r.status==='cancelled' || r.status==='stop' || r.status==='stopped';
    const tag = r.status==='cancelled' ? '<span class="mtag can">בוטל</span>' : r.status==='stop'||r.status==='stopped' ? '<span class="mtag can">✕ נעצרה בסטופ</span>' : r.status==='target' ? '<span class="mtag ok">✓ הגיעה ליעד</span>' : '';
    return `<div class="row${gone?' gone':''}" style="display:block"><div style="display:flex;gap:8px;align-items:center"><span class="tk" style="font-size:15px">${esc(r.ticker)}</span><span class="nm">${esc(r.name)}${r.new_this_week?' · חדשה השבוע':''}</span>${tag}<span style="margin-inline-start:auto;font-weight:800">${pc(r.week_pct)}</span></div>
    <div class="px">${r.new_this_week?`מההמלצה ${money(r.ref,r.cur)}`:`מתחילת השבוע ${money(r.week_start,r.cur)}`} ← ${money(r.close,r.cur)} (${dmy(r.close_date)}) · מאז ההמלצה ${pc(r.since_rec_pct)}</div>${wbar(r.week_pct, mxL)}</div>`;
  }).join('') : '<div class="empty">אין מניות לטווח ארוך בשבוע הזה.</div>'}</div>`;
  return h + foot();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
render(); load(false);
let lastMode = null; setInterval(()=>{ if (!D) return; const k = JSON.stringify(feedTarget()); if (lastMode && k!==lastMode && ((location.hash||'#home')==='#home')) render(); lastMode = k; }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') load(true); });
</script>
